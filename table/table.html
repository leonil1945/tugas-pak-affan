<!DOCTYPE html>
<html>
<head>
    <title>Contoh Tabel dengan Colspan dan Rowspan</title>
</head>
<body>
    <h1>Jadwal Pelajaran</h1>
    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th rowspan="2">Hari</th>
            <th colspan="3">Mata Pelajaran</th>
        </tr>
        <tr>
            <th>Jam 1</th>
            <th>Jam 2</th>
            <th>Jam 3</th>
        </tr>
        <tr>
            <td>Senin</td>
            <td>Matematika</td>
            <td rowspan="2">Bahasa Inggris</td>
            <td>Sejarah</td>
        </tr>
        <tr>
            <td>Selasa</td>
            <td>Fisika</td>
            <td>Biologi</td>
        </tr>
        <tr>
            <td>Rabu</td>
            <td colspan="3">Praktek RPL (Full Day)</td>
        </tr>
    </table>
</body>
</html>
